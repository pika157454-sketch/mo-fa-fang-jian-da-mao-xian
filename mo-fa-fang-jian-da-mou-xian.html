<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="data:," />
    <title>魔法房间大冒险</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" />
    <style>
      :root{
        --ink:#40222e;
        --paper:#fff8ec;
        --sun:#ffc93c;
        --coral:#ff6b6b;
        --pink:#ff9ecb;
        --mint:#3ecf8e;
        --sky:#4db8ff;
        --grape:#8b6fd8;
        --radius:22px;
        --shadow:0 6px 0 rgba(64,34,46,.9);
      }
      *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
      html,body{margin:0;padding:0}
      body{
        font-family:"ZCOOL KuaiLe","Baloo 2","PingFang SC","Microsoft YaHei",sans-serif;
        color:var(--ink);
        background:#2a1840;
        min-height:100dvh;
        overflow-x:hidden;
        user-select:none;-webkit-user-select:none;
        touch-action:manipulation;
      }
      button{font-family:inherit;cursor:pointer;color:var(--ink)}
      .num{font-family:"Baloo 2","ZCOOL KuaiLe",sans-serif}

      /* ---------- 通用舞台 ---------- */
      .screen{display:none;min-height:100dvh;flex-direction:column;position:relative}
      .screen.on{display:flex}
      .wrap{width:100%;max-width:560px;margin:0 auto;padding:14px 16px 34px;flex:1;display:flex;flex-direction:column}

      .btn{
        border:3.5px solid var(--ink);border-radius:999px;background:var(--sun);
        font-size:21px;padding:12px 30px;box-shadow:var(--shadow);
        transition:transform .08s, box-shadow .08s;letter-spacing:.04em;
      }
      .btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(64,34,46,.9)}
      .btn.coral{background:var(--coral);color:#fff}
      .btn.mint{background:var(--mint);color:#fff}
      .btn.sky{background:var(--sky);color:#fff}
      .btn.ghost{background:#fff}
      .btn.small{font-size:16px;padding:8px 18px;border-width:3px}
      .btn:disabled{filter:grayscale(.7);opacity:.55;cursor:default}

      .topbar{display:flex;align-items:center;gap:10px;padding:12px 16px 4px;max-width:560px;margin:0 auto;width:100%}
      .iconbtn{
        width:46px;height:46px;flex:0 0 46px;border-radius:50%;border:3px solid var(--ink);
        background:#fff;display:grid;place-items:center;box-shadow:0 4px 0 rgba(64,34,46,.9);
        font-size:20px;line-height:1;
      }
      .iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(64,34,46,.9)}
      .iconbtn svg{width:22px;height:22px}

      /* ---------- 首页 ---------- */
      #screen-home{background:linear-gradient(180deg,#ffd9ec 0%,#ffeec9 46%,#c9f2ff 100%);overflow:hidden}
      .home-sky{position:absolute;inset:0;pointer-events:none;overflow:hidden}
      .cloud{position:absolute;background:#fff;border-radius:999px;opacity:.92;animation:drift linear infinite}
      .cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
      .cloud::before{width:55%;height:170%;left:12%;top:-95%}
      .cloud::after{width:38%;height:120%;right:10%;top:-60%}
      @keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(115vw)}}
      .floaty{position:absolute;animation:bob 3.2s ease-in-out infinite;pointer-events:none}
      @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-14px) rotate(3deg)}}
      .home-inner{position:relative;text-align:center;padding-top:8px}
      .logo-badge{
        display:inline-block;background:#fff;border:3.5px solid var(--ink);border-radius:999px;
        padding:5px 18px;font-size:15px;box-shadow:0 4px 0 rgba(64,34,46,.85);transform:rotate(-2deg);
      }
      h1.game-title{
        margin:14px 0 2px;font-size:clamp(44px,11.5vw,64px);line-height:1.08;letter-spacing:.02em;
        color:#fff;
        text-shadow:3px 3px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),0 8px 0 rgba(64,34,46,.25);
      }
      h1.game-title .t1{color:#ffe066}
      h1.game-title .t2{color:#ff9ecb}
      .home-sub{font-size:18px;margin:10px auto 4px;background:rgba(255,255,255,.75);display:inline-block;padding:4px 16px;border-radius:999px;border:2.5px dashed var(--ink)}
      .hero-cats{display:flex;justify-content:center;align-items:flex-end;gap:6px;margin:10px 0 2px}
      .hero-cats svg{filter:drop-shadow(0 6px 0 rgba(64,34,46,.18))}
      .bounce-cat{animation:catbounce 1.6s ease-in-out infinite;transform-origin:50% 100%}
      @keyframes catbounce{0%,100%{transform:scale(1,1)}30%{transform:scale(1.06,.9)}55%{transform:scale(.96,1.07) translateY(-8px)}75%{transform:scale(1.02,.97)}}
      .home-btns{display:flex;flex-direction:column;gap:14px;align-items:center;margin-top:16px}
      .home-stats{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}
      .stat-chip{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:7px 14px;font-size:16px;box-shadow:0 4px 0 rgba(64,34,46,.85);display:flex;align-items:center;gap:6px}
      .stat-chip svg{width:19px;height:19px}
      .sticker-row{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap;min-height:10px}
      .sticker{width:56px;height:56px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;background:#fff;box-shadow:0 4px 0 rgba(64,34,46,.8);position:relative}
      .sticker svg{width:36px;height:36px}
      .sticker.locked{filter:grayscale(1);opacity:.4}
      .sticker .st-name{position:absolute;bottom:-19px;left:50%;transform:translateX(-50%);font-size:11px;white-space:nowrap}
      .home-foot{margin-top:30px;font-size:13.5px;opacity:.75;text-align:center}

      /* ---------- 故事 ---------- */
      #screen-story{background:linear-gradient(180deg,#b8e6ff,#ffe9f4)}
      .story-card{background:var(--paper);border:4px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 rgba(64,34,46,.85);padding:20px 18px;text-align:center;margin-top:10px}
      .story-pic{height:190px;display:grid;place-items:center}
      .story-pic svg{max-height:190px;width:auto;max-width:100%}
      .story-text{font-size:21px;line-height:1.55;margin:8px 4px 4px;min-height:66px}
      .story-dots{display:flex;gap:8px;justify-content:center;margin:14px 0 18px}
      .story-dots i{width:13px;height:13px;border-radius:50%;border:2.5px solid var(--ink);background:#fff}
      .story-dots i.on{background:var(--coral)}

      /* ---------- 地图 ---------- */
      #screen-map{background:linear-gradient(180deg,#aee7ff 0%,#d8f7d0 55%,#ffedbe 100%)}
      .map-title{font-size:26px;margin:6px 0 2px;text-align:center}
      .map-sub{text-align:center;font-size:15px;opacity:.8;margin-bottom:6px}
      .world-block{margin:18px 0 4px}
      .world-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
      .world-badge{width:44px;height:44px;border-radius:14px;border:3px solid var(--ink);display:grid;place-items:center;box-shadow:0 4px 0 rgba(64,34,46,.85);flex:0 0 44px}
      .world-badge svg{width:28px;height:28px}
      .world-name{font-size:21px}
      .world-info{font-size:13px;opacity:.75}
      .world-sticker{margin-left:auto;font-size:13px;background:#fff;border:2.5px solid var(--ink);border-radius:999px;padding:3px 10px}
      .level-path{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
      .lv{
        position:relative;border:3.5px solid var(--ink);border-radius:20px;padding:12px 6px 10px;text-align:center;
        box-shadow:0 5px 0 rgba(64,34,46,.85);background:#fff;transition:transform .1s;
      }
      .lv:active{transform:scale(.96)}
      .lv .lv-no{font-size:12.5px;opacity:.65}
      .lv .lv-ico{height:44px;display:grid;place-items:center;margin:2px 0}
      .lv .lv-ico svg{width:40px;height:40px}
      .lv .lv-name{font-size:15.5px;line-height:1.25;min-height:38px;display:flex;align-items:center;justify-content:center}
      .lv .lv-type{font-size:12px;opacity:.7}
      .lv .lv-stars{font-size:14px;letter-spacing:2px;min-height:19px;color:#e8a100}
      .lv .lv-stars .off{color:#d8d2cc}
      .lv.locked{filter:grayscale(.85);opacity:.55}
      .lv.locked .lv-ico{opacity:.5}
      .lv .lock-ico{position:absolute;top:6px;right:8px;width:16px;height:16px}
      .lv.done{border-color:var(--ink)}
      .lv.next{animation:pulseGlow 1.4s ease-in-out infinite}
      @keyframes pulseGlow{0%,100%{box-shadow:0 5px 0 rgba(64,34,46,.85),0 0 0 0 rgba(255,201,60,.75)}50%{box-shadow:0 5px 0 rgba(64,34,46,.85),0 0 0 9px rgba(255,201,60,0)}}

      /* ---------- 游戏通用 ---------- */
      #screen-game{background:#ffe9c9}
      .game-head{max-width:560px;margin:0 auto;width:100%;padding:10px 16px 0;display:flex;align-items:center;gap:10px}
      .game-titlebox{flex:1;min-width:0}
      .game-lvname{font-size:19px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .game-lvsub{font-size:13px;opacity:.75}
      .hud-chip{background:#fff;border:3px solid var(--ink);border-radius:999px;padding:4px 12px;font-size:15px;display:flex;gap:5px;align-items:center;box-shadow:0 3px 0 rgba(64,34,46,.85);white-space:nowrap}
      .hud-chip svg{width:16px;height:16px}
      .task-bar{
        max-width:560px;margin:10px auto 0;width:calc(100% - 32px);background:#fff;border:3.5px solid var(--ink);
        border-radius:18px;padding:9px 14px;font-size:17.5px;text-align:center;box-shadow:0 4px 0 rgba(64,34,46,.85);line-height:1.4;
      }
      .task-bar b{color:#e0483e}
      .stage-wrap{flex:1;display:flex;flex-direction:column;max-width:560px;margin:0 auto;width:100%;padding:12px 16px 26px}
      .stage{
        position:relative;border:4px solid var(--ink);border-radius:26px;overflow:hidden;flex:1;min-height:380px;
        box-shadow:0 8px 0 rgba(64,34,46,.85);touch-action:none;
      }
      .stage svg.scene{position:absolute;inset:0;width:100%;height:100%}
      .hint-row{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}

      /* 找一找 */
      .find-item{position:absolute;transform:translate(-50%,-50%);cursor:pointer;z-index:5;transition:transform .15s,opacity .3s;filter:drop-shadow(2px 3px 0 rgba(64,34,46,.35))}
      .find-item:active{transform:translate(-50%,-50%) scale(1.2)}
      .find-item.found{animation:foundPop .55s ease forwards;pointer-events:none}
      @keyframes foundPop{0%{transform:translate(-50%,-50%) scale(1)}40%{transform:translate(-50%,-60%) scale(1.5) rotate(-8deg)}100%{transform:translate(-50%,-160%) scale(.4);opacity:0}}
      .find-list{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
      .find-chip{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:5px 10px 3px;display:flex;flex-direction:column;align-items:center;font-size:12.5px;min-width:58px;box-shadow:0 3px 0 rgba(64,34,46,.8)}
      .find-chip svg{width:30px;height:30px}
      .find-chip.got{background:var(--mint);color:#fff;border-color:var(--ink)}
      .find-chip.got svg{filter:brightness(0) invert(1)}

      /* 翻牌 */
      .memory-board{position:absolute;inset:0;display:grid;gap:10px;padding:16px;align-content:stretch}
      .mcard{perspective:600px;cursor:pointer;background:none;border:none;padding:0;width:100%;max-width:112px;aspect-ratio:0.82;max-height:100%;justify-self:center;align-self:center}
      .mcard .inner{display:block;position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.34,1.4,.5,1)}
      .mcard.flip .inner{transform:rotateY(180deg)}
      .mface{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:3.5px solid var(--ink);border-radius:16px;display:grid;place-items:center;box-shadow:0 4px 0 rgba(64,34,46,.8)}
      .mface.back{background:repeating-linear-gradient(45deg,#ff8fb5 0 12px,#ffaecb 12px 24px)}
      .mface.back svg{width:34px;height:34px}
      .mface.front{background:#fff;transform:rotateY(180deg)}
      .mface.front svg{width:62%;height:62%}
      .mcard.matched .mface.front{background:#d9fbe8;animation:matchWiggle .5s ease}
      @keyframes matchWiggle{0%,100%{transform:rotateY(180deg) rotate(0)}25%{transform:rotateY(180deg) rotate(-5deg) scale(1.06)}75%{transform:rotateY(180deg) rotate(5deg) scale(1.06)}}

      /* 接星星 */
      .catch-layer{position:absolute;inset:0;overflow:hidden}
      .falling{position:absolute;transform:translate(-50%,-50%);pointer-events:none;will-change:top}
      .basket{position:absolute;bottom:8px;transform:translateX(-50%);pointer-events:none;z-index:6;transition:none}
      .catch-pop{position:absolute;font-size:22px;color:#fff;text-shadow:2px 2px 0 var(--ink);pointer-events:none;animation:riseFade .7s ease forwards;z-index:7}
      @keyframes riseFade{to{transform:translateY(-44px);opacity:0}}

      /* 时钟 */
      .clock-wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px}
      .clock-svg{width:min(74vw,300px);height:auto;touch-action:none}
      .clock-target{font-size:21px;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:4px 18px;box-shadow:0 3px 0 rgba(64,34,46,.8)}
      .clock-read{font-size:17px;opacity:.85}
      .clock-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

      /* 拼图 */
      .puzzle-board{position:absolute;inset:0;display:grid;gap:6px;padding:14px;align-content:center;justify-content:center}
      .ptile{border:3px solid var(--ink);border-radius:12px;overflow:hidden;position:relative;cursor:pointer;background:#fff;padding:0}
      .ptile svg{position:absolute;pointer-events:none}
      .ptile.sel{outline:4px solid var(--sun);outline-offset:-2px;animation:tilePulse .7s ease-in-out infinite}
      @keyframes tilePulse{50%{transform:scale(.94)}}
      .ptile.right{border-color:var(--mint)}

      /* 迷宫 */
      .maze-board{position:absolute;inset:0;display:grid;place-content:center;padding:10px}
      .mcell{position:relative}
      .mcell .mchar{position:absolute;inset:6%;display:grid;place-items:center;z-index:3}
      .mcell .mchar svg{width:100%;height:100%}
      .maze-pad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,52px);gap:6px;justify-content:center;margin-top:14px}
      .maze-pad button{border:3px solid var(--ink);border-radius:14px;background:#fff;font-size:21px;box-shadow:0 4px 0 rgba(64,34,46,.85)}
      .maze-pad button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(64,34,46,.85)}
      .maze-pad .pad-empty{visibility:hidden}

      /* ---------- 结算 / 弹窗 ---------- */
      .overlay{position:fixed;inset:0;background:rgba(43,20,38,.55);display:none;place-items:center;z-index:60;padding:18px}
      .overlay.on{display:grid}
      .win-card{background:var(--paper);border:4.5px solid var(--ink);border-radius:30px;box-shadow:0 10px 0 rgba(64,34,46,.9);max-width:430px;width:100%;padding:24px 20px 22px;text-align:center;animation:cardIn .5s cubic-bezier(.3,1.5,.5,1)}
      @keyframes cardIn{from{transform:scale(.6) rotate(-4deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
      .win-title{font-size:32px;margin:2px 0 4px}
      .win-stars{display:flex;justify-content:center;gap:8px;margin:10px 0 4px}
      .win-stars svg{width:56px;height:56px;filter:drop-shadow(0 3px 0 rgba(64,34,46,.4))}
      .win-stars .star-pop{animation:starPop .6s cubic-bezier(.3,1.8,.5,1) both}
      @keyframes starPop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1) rotate(0)}}
      .win-msg{font-size:17.5px;line-height:1.5;margin:6px 4px 2px}
      .win-reward{display:inline-flex;gap:6px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:5px 16px;font-size:16.5px;margin-top:10px;box-shadow:0 3px 0 rgba(64,34,46,.8)}
      .win-reward svg{width:19px;height:19px}
      .win-btns{display:flex;gap:12px;justify-content:center;margin-top:18px;flex-wrap:wrap}
      .win-cat{display:flex;justify-content:center;margin-bottom:2px}

      /* 通关大结局 */
      #screen-end{background:linear-gradient(180deg,#3b2a63 0%,#6a4a9e 55%,#ff9ecb 130%);color:#fff;overflow:hidden}
      .end-inner{text-align:center;position:relative;padding-top:26px}
      .end-title{font-size:clamp(36px,9.5vw,50px);color:#ffe066;text-shadow:3px 3px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink)}
      .end-cats{display:flex;justify-content:center;align-items:flex-end;margin:14px 0}
      .end-card{background:rgba(255,248,236,.97);color:var(--ink);border:4px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 rgba(0,0,0,.35);padding:18px;margin-top:14px;text-align:left}
      .end-card h3{margin:0 0 10px;font-size:20px;text-align:center}
      .end-line{display:flex;justify-content:space-between;font-size:16.5px;padding:5px 2px;border-bottom:2px dashed #e6d9c8}
      .end-line:last-child{border-bottom:none}
      .heart{position:absolute;color:#ff6b9d;animation:heartFloat 3.4s ease-in infinite;pointer-events:none;text-shadow:2px 2px 0 rgba(64,34,46,.5)}
      @keyframes heartFloat{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translateY(-46vh) scale(1.15) rotate(14deg);opacity:0}}

      .particle{position:fixed;pointer-events:none;z-index:80;border-radius:3px}
      .toast{
        position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;
        padding:10px 22px;border-radius:999px;font-size:16.5px;z-index:90;transition:transform .3s;max-width:88vw;text-align:center;
      }
      .toast.on{transform:translateX(-50%) translateY(0)}
      .shake{animation:shk .4s ease}
      @keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
      .wiggle{animation:wgl 2.6s ease-in-out infinite;transform-origin:50% 90%}
      @keyframes wgl{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}

      @media (max-width:380px){
        .btn{font-size:19px;padding:11px 24px}
        .stage{min-height:340px}
      }
      @media (prefers-reduced-motion:reduce){
        .cloud,.floaty,.bounce-cat,.lv.next,.wiggle{animation:none}
      }
    </style>
  </head>
  <body>
    <!-- ================= 首页 ================= -->
    <section class="screen on" id="screen-home">
      <div class="home-sky" id="homeSky"></div>
      <div class="wrap home-inner">
        <div><span class="logo-badge">奶盖和墨墨的</span></div>
        <h1 class="game-title"><span class="t1">魔法房间</span><br /><span class="t2">大冒险</span></h1>
        <div><span class="home-sub">穿过 30 间魔法房，找回小黑猫墨墨！</span></div>
        <div class="hero-cats">
          <span class="bounce-cat" id="heroWhite"></span>
          <span class="bounce-cat" id="heroBlack" style="animation-delay:.35s"></span>
        </div>
        <div class="home-btns">
          <button class="btn coral" id="btnStart" style="font-size:25px;padding:14px 44px">开始冒险</button>
          <button class="btn ghost" id="btnMap">冒险地图</button>
          <button class="btn sky small" id="btnStory">听听故事</button>
        </div>
        <div class="home-stats">
          <span class="stat-chip" id="chipStars"></span>
          <span class="stat-chip" id="chipCoins"></span>
          <span class="stat-chip" id="chipLevels"></span>
        </div>
        <div class="sticker-row" id="stickerRow"></div>
        <p class="home-foot">找一找 · 数一数 · 算一算 · 比大小 · 找规律 · 分一分<br />排排序 · 翻牌 · 接星星 · 拨时钟 · 拼图 · 走迷宫<br />找不同 · 影子配对 · 像素方块 · 挑不同<br />16 种益智玩法轮着来，越玩越聪明！</p>
      </div>
    </section>

    <!-- ================= 故事 ================= -->
    <section class="screen" id="screen-story">
      <div class="topbar">
        <button class="iconbtn" data-back="home" aria-label="返回">‹</button>
      </div>
      <div class="wrap">
        <div class="story-card">
          <div class="story-pic" id="storyPic"></div>
          <p class="story-text" id="storyText"></p>
          <div class="story-dots" id="storyDots"></div>
          <button class="btn coral" id="btnStoryNext">下一页</button>
        </div>
      </div>
    </section>

    <!-- ================= 地图 ================= -->
    <section class="screen" id="screen-map">
      <div class="topbar">
        <button class="iconbtn" data-back="home" aria-label="返回">‹</button>
      </div>
      <div class="wrap">
        <div class="map-title">冒险地图</div>
        <div class="map-sub">点亮每一间魔法房，把墨墨找回来！</div>

/* ============================================================
   魔法房间大冒险 · 游戏引擎
   ============================================================ */
"use strict";
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const rand = (a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function toast(msg,ms){const t=$("#toast");t.textContent=msg;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),ms||1900);}

/* ---------- 声音（WebAudio 合成，无需音频文件） ---------- */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==="suspended")AC.resume();return AC;}
function tone(f,t0,d,type,vol){const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type||"sine";o.frequency.value=f;const s=c.currentTime+t0;g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(vol||0.16,s+0.02);g.gain.exponentialRampToValueAtTime(0.0001,s+d);o.connect(g);g.connect(c.destination);o.start(s);o.stop(s+d+0.05);}
function sfx(name){
  if(name==="pop"){tone(660,0,0.12,"sine",0.2);tone(990,0.05,0.14,"sine",0.16);}
  else if(name==="good"){tone(523,0,0.14,"triangle",0.2);tone(659,0.09,0.14,"triangle",0.2);tone(784,0.18,0.22,"triangle",0.2);}
  else if(name==="wrong"){tone(220,0,0.16,"square",0.07);tone(185,0.1,0.2,"square",0.06);}
  else if(name==="coin"){tone(988,0,0.1,"square",0.1);tone(1319,0.08,0.2,"square",0.1);}
  else if(name==="win"){[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,i*0.11,0.26,"triangle",0.2));}
  else if(name==="flip"){tone(440,0,0.08,"sine",0.12);}
  else if(name==="step"){tone(392,0,0.07,"sine",0.1);}
}

/* ---------- 五彩纸屑 & 星星爆发 ---------- */
function burst(x,y,n,colors){
  const cols=colors||["#ff6b6b","#ffc93c","#3ecf8e","#4db8ff","#ff9ecb","#8b6fd8"];
  for(let i=0;i<(n||36);i++){
    const p=document.createElement("div");p.className="particle";
    const s=rand(6,12);p.style.width=s+"px";p.style.height=(Math.random()<0.4?s:s*0.45)+"px";
    p.style.background=pick(cols);p.style.left=x+"px";p.style.top=y+"px";p.style.zIndex=95;
    if(Math.random()<0.3)p.style.borderRadius="50%";
    document.body.appendChild(p);
    const ang=Math.random()*Math.PI*2,v=rand(90,320),dx=Math.cos(ang)*v,dy=Math.sin(ang)*v-140;
    p.animate([{transform:"translate(0,0) rotate(0deg)",opacity:1},{transform:"translate("+dx+"px,"+(dy+330)+"px) rotate("+rand(-360,360)+"deg)",opacity:0.9}],{duration:rand(750,1250),easing:"cubic-bezier(.17,.67,.35,1)"}).onfinish=()=>p.remove();
  }
}
function confettiRain(){
  const w=window.innerWidth;
  for(let i=0;i<5;i++)setTimeout(()=>burst(rand(40,w-40),rand(30,140),22),i*130);
}

function winLevel(starOverride){

BUILDERS.find=function(){
  const lv=G.lv, d=lv.d;
  const pool=[["key","gem","star","heart","apple"],["donut","lollipop","cupcake","strawberry","key"],["bell","book","key","gem","candle"],["shell","pearl","star","fish","gem"],["moon","wand","rocket","star","key"]][G.wi];
  const extraPool=["mushroom","flower","ball","sock","gift","balloon","egg","carrot"];
  const nFind = lv.final?6:(2+d+1); // 4 / 5 / 6
  const targets=shuffle(pool).slice(0,Math.min(nFind,pool.length));
  if(lv.final&&targets.length<6)targets.push("heart");
  const spots=[[16,30],[78,24],[46,58],[86,66],[28,78],[64,86],[10,62],[90,40],[52,20],[36,44]];
  const chosen=shuffle(spots).slice(0,targets.length+3);
  const stage=$("#stage");
  stage.innerHTML=sceneSVG(G.wi,G.no*3+1);
  setTask(lv.final?"最后一间房！找到藏起来的宝贝们，就能找到<b>墨墨</b>！":"把这些宝贝都找出来：点一点它们藏身的地方！");
  let found=0;
  targets.forEach((t,i)=>{
    const s=chosen[i];
    const dEl=document.createElement("div");dEl.className="find-item";
    const size=lv.d===1?54:(lv.d===2?47:41);
    dEl.style.cssText="left:"+s[0]+"%;top:"+s[1]+"%;width:"+size+"px;height:"+size+"px;opacity:"+(lv.d===3?0.92:1);

    dEl.addEventListener("click",ev=>{
      if(dEl.classList.contains("found"))return;
      dEl.classList.add("found"); sfx("pop");
      burst(ev.clientX,ev.clientY,14);
      const chip=$("#chip-"+t); if(chip)chip.classList.add("got");

    });

  });
  // 干扰小物件（点错算失误，轻轻的那种）
  shuffle(extraPool).slice(0,3).forEach((t,i)=>{
    const s=chosen[targets.length+i]; if(!s)return;
    const dEl=document.createElement("div");dEl.className="find-item";
    dEl.style.cssText="left:"+s[0]+"%;top:"+s[1]+"%;width:42px;height:42px;opacity:.95";

    stage.appendChild(bc);

/* ---------- 算一算（加减法） ---------- */
BUILDERS.calc=function(){
  const d=G.lv.d;
  let rounds=3, done=0;
  const stage=$("#stage");
  function newRound(){
    if(G.done)return;
    const isAdd = d===1 ? true : (d===2 ? Math.random()<0.6 : Math.random()<0.5);
    let a,b,ans;
    if(isAdd){ a=rand(2,d===1?6:(d===2?12:25)); b=rand(1,d===1?5:(d===2?9:15)); ans=a+b; }
    else{ a=rand(5,d===1?9:(d===2?15:30)); b=rand(1,a-1); ans=a-b; }
    const ico=pick(["apple","star","fish","flower","donut","ball"]);
    stage.innerHTML=plainBG(G.wi);
    setTask(isAdd?"算一算：合起来一共有几个？":"算一算：拿走一些，还剩几个？");
    const box=document.createElement("div");
    box.style.cssText="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px";
    const group=(cnt,dim)=>'<div style="display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:230px">'+Array.from({length:cnt},(_,i)=>'<span style="width:38px;height:38px;display:inline-block;'+(dim&&i>=ans?'opacity:.28;filter:grayscale(.8);transform:scale(.86)':"")+'">'+ICONS[ico]()+"</span>").join("")+"</div>";
    if(isAdd){
      box.innerHTML='<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center">'+group(a)
        +'<span style="font-size:40px" class="num">+</span>'+group(b)
        +'<span style="font-size:40px" class="num">= ?</span></div>'
        +'<div class="num" style="font-size:30px;background:#fff;border:3px solid '+INK+';border-radius:14px;padding:2px 20px">'+a+" + "+b+" = ?</div>";
    }else{
      box.innerHTML=group(a,true)
        +'<div class="num" style="font-size:30px;background:#fff;border:3px solid '+INK+';border-radius:14px;padding:2px 20px">'+a+" − "+b+" = ?</div>"
        +'<div style="font-size:15.5px;opacity:.8">灰色的就是被拿走的哦</div>';
    }
    stage.appendChild(box);
    const opts=shuffle([ans,ans+1,Math.max(0,ans-1),ans+2].filter((v,i,arr)=>arr.indexOf(v)===i)).slice(0,3);
    $("#underStage").innerHTML='<div style="text-align:center;font-size:14.5px;opacity:.75;margin-top:10px">第 '+(done+1)+" / "+rounds+' 题</div><div class="hint-row">'+opts.map(v=>'<button class="btn ghost num" data-v="'+v+'" style="font-size:26px;min-width:76px">'+v+"</button>").join("")+"</div>";
    $$("#underStage [data-v]").forEach(btn=>btn.addEventListener("click",()=>{
      if(parseInt(btn.dataset.v,10)===ans){sfx("good");btn.classList.remove("ghost");btn.classList.add("mint");done++;
        if(done>=rounds)setTimeout(()=>winLevel(),450); else setTimeout(newRound,650);}
      else mistakeFx(btn);
    }));
  }
  newRound();
};

/* ---------- 找规律 ---------- */
BUILDERS.pattern=function(){
  const d=G.lv.d;
  let rounds=3, done=0;
  const stage=$("#stage");
  const SETS=[
    {pool:["star","heart","moon","apple"],kind:"icon"},
    {pool:["apple","orange","banana","grape"],kind:"icon"},
    {pool:["fish","shell","star","pearl"],kind:"icon"},
    {pool:["red","blue","yellow","green"],kind:"color"},
    {pool:["circle","square","triangle"],kind:"shape"},
  ];
  function seqFor(set){
    const p=shuffle(set.pool);
    const kind=pick(d===1?["AB","AAB"]:["AB","AAB","ABC","ABB"]);
    let seq=[],answer;
    if(kind==="AB"){seq=[p[0],p[1],p[0],p[1],p[0]];answer=p[1];}
    else if(kind==="AAB"){seq=[p[0],p[0],p[1],p[0],p[0]];answer=p[1];}
    else if(kind==="ABB"){seq=[p[0],p[1],p[1],p[0],p[1]];answer=p[1];}
    else{seq=[p[0],p[1],p[2],p[0],p[1]];answer=p[2];}
    return{seq:seq,answer:answer,others:shuffle(set.pool.filter(x=>x!==answer)).slice(0,2)};
  }
  function cell(v,set,size){
    if(set.kind==="icon")return ICONS[v]();
    if(set.kind==="color"){const c={red:"#ff5252",blue:"#4db8ff",yellow:"#ffc93c",green:"#3ecf8e"}[v];return '<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="22" fill="'+c+'" stroke="'+INK+'" stroke-width="3.5"/></svg>';}
    if(v==="circle")return '<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="21" fill="#ff9ecb" stroke="'+INK+'" stroke-width="3.5"/></svg>';
    if(v==="square")return '<svg viewBox="0 0 64 64"><rect x="12" y="12" width="40" height="40" rx="6" fill="#4db8ff" stroke="'+INK+'" stroke-width="3.5"/></svg>';
    return '<svg viewBox="0 0 64 64"><path d="M32 10 L54 50 L10 50Z" fill="#ffc93c" stroke="'+INK+'" stroke-width="3.5" stroke-linejoin="round"/></svg>';
  }
  function newRound(){
    if(G.done)return;
    const set=pick(SETS);
    const q=seqFor(set);
    stage.innerHTML=plainBG(G.wi);
    setTask("看一看：接下来应该是什么？点一点正确的！");
    const wrap=document.createElement("div");
    wrap.style.cssText="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:14px";
    wrap.innerHTML='<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">'
      +q.seq.map(v=>'<span style="width:56px;height:56px;background:#fff;border:3.5px solid '+INK+';border-radius:16px;display:grid;place-items:center;padding:7px;box-shadow:0 4px 0 rgba(64,34,46,.8)">'+cell(v,set)+"</span>").join("")
      +'<span style="width:56px;height:56px;background:#ffe9a8;border:3.5px dashed '+INK+';border-radius:16px;display:grid;place-items:center;font-size:30px">?</span></div>'
      +'<div style="font-size:16px;opacity:.85">找出藏起来的规律～</div>';
    stage.appendChild(wrap);
    const opts=shuffle([q.answer].concat(q.others));
    $("#underStage").innerHTML='<div style="text-align:center;font-size:14.5px;opacity:.75;margin-top:10px">第 '+(done+1)+" / "+rounds+' 题</div><div class="hint-row">'+opts.map(v=>'<button class="btn ghost" data-v="'+v+'" style="width:74px;height:74px;padding:10px;border-radius:18px">'+cell(v,set)+"</button>").join("")+"</div>";
    $$("#underStage [data-v]").forEach(b=>b.addEventListener("click",()=>{
      if(b.dataset.v===String(q.answer)){sfx("good");b.classList.remove("ghost");b.classList.add("mint");done++;
        if(done>=rounds)setTimeout(()=>winLevel(),450); else setTimeout(newRound,650);}
      else mistakeFx(b);
    }));
  }
  newRound();
};

    +'<div style="position:absolute;left:50%;top:-30px;transform:translateX(-50%);width:44px">'+whiteCat(44)+"</div>";
  layer.appendChild(basket);
  let bx=50, caught=0, missedBad=0, alive=true, items=[], last=0, startT=performance.now(), spawnT=0;
  const speedBase=d===1?0.055:(d===2?0.075:0.095);

  function spawn(now){
    const bad=Math.random()<(d===1?0.16:0.24);
    const el=document.createElement("div");el.className="falling";
    const sz=bad?40:46;
    el.style.cssText="left:"+rand(6,94)+"%;top:-8%;width:"+sz+"px;height:"+sz+"px";
    el.innerHTML=bad
      ? '<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="17" fill="#7a6a8f" stroke="'+INK+'" stroke-width="3.4"/><g stroke="'+INK+'" stroke-width="3.4" stroke-linecap="round"><path d="M32 4 L32 12 M32 52 L32 60 M4 32 L12 32 M52 32 L60 32 M12 12 L18 18 M46 46 L52 52 M52 12 L46 18 M18 46 L12 52"/></g><circle cx="26" cy="29" r="2.4" fill="#fff"/><circle cx="38" cy="29" r="2.4" fill="#fff"/><path d="M26 40 Q32 36 38 40" stroke="#fff" stroke-width="2.4" fill="none"/></svg>'
      : ICONS.star();

    items.push({el:el,y:-8,x:parseFloat(el.style.left),bad:bad,vy:speedBase*(0.8+Math.random()*0.5)*(bad?1.15:1)});
  }
  function frame(now){
    if(!alive||!G||G.done)return;
    const dt=Math.min(50,now-(last||now)); last=now;
    const remain=timeTotal-(now-startT)/1000;
    const tEl=$("#ctTime"); if(tEl)tEl.textContent=Math.max(0,Math.ceil(remain));
    if(remain<=0){alive=false; if(caught>=Math.ceil(target*0.6)){winLevel(caught>=target?undefined:(G.mistakes+=1,undefined));} else {toast("差一点点！再来一次吧",1600);setTimeout(()=>{if(G&&!G.done)startLevel(G.no);},1500);} return;}
    if(now-spawnT> (d===3?620:800)){spawn(now);spawnT=now;}
    const H=stage.clientHeight,W=stage.clientWidth;
    items=items.filter(it=>{
      it.y+=it.vy*dt; it.el.style.top=it.y+"%";

        return false;
      }
      if(yPx>H+30){it.el.remove();if(!it.bad&&d>=2){/* 漏掉不扣分，只提醒 */}return false;}
      return true;
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  G.cleanup=()=>{alive=false;stage.removeEventListener("pointermove",onMove);stage.removeEventListener("pointerdown",onMove);stage.removeEventListener("touchmove",onMove);};

/* ---------- 认时间（拨时钟） ---------- */
BUILDERS.clock=function(){
  const d=G.lv.d;
  let rounds=d===1?2:3, done=0;
  const stage=$("#stage");
  function newRound(){
    if(G.done)return;
    let th,tm;
    if(d===1){th=rand(1,12);tm=0;}
    else if(d===2){th=rand(1,12);tm=pick([0,30,15,45]);}
    else{th=rand(1,12);tm=pick([5,10,20,25,35,40,50,55]);}
    const target=th*60+tm;
    let cur=rand(1,12)*60; // 随机整点开始
    stage.innerHTML=plainBG(G.wi);
    setTask("把时钟拨到 <b>"+th+" 点"+(tm===0?"整":tm===30?"半":tm+" 分")+"</b>！拖动长针（分针）转圈圈。");
    const wrap=document.createElement("div");wrap.className="clock-wrap";
    const marks=Array.from({length:12},(_,i)=>{const a=i*30*Math.PI/180;const x=100+Math.sin(a)*78,y=100-Math.cos(a)*78;return '<text x="'+x+'" y="'+(y+6)+'" text-anchor="middle" font-size="16" font-weight="bold" fill="'+INK+'" font-family="Baloo 2">'+(i===0?12:i)+"</text>";}).join("");
    wrap.innerHTML='<svg class="clock-svg" id="clockSvg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">'
      +'<circle cx="100" cy="100" r="94" fill="#fff8ec" stroke="'+INK+'" stroke-width="6"/>'
      +'<circle cx="100" cy="100" r="80" fill="#fff" stroke="'+INK+'" stroke-width="2.5"/>'
      +marks
      +'<g id="hourHand"><path d="M100 100 L100 56" stroke="#ff6b6b" stroke-width="10" stroke-linecap="round"/><path d="M100 62 L92 74 L108 74Z" fill="#ff6b6b"/></g>'
      +'<g id="minHand"><path d="M100 100 L100 30" stroke="#4db8ff" stroke-width="7" stroke-linecap="round"/><circle cx="100" cy="30" r="9" fill="#4db8ff" stroke="'+INK+'" stroke-width="3"/></g>'
      +'<circle cx="100" cy="100" r="9" fill="#ffc93c" stroke="'+INK+'" stroke-width="3.4"/></svg>'
      +'<div class="clock-target num">目标：'+th+" : "+String(tm).padStart(2,"0")+'</div>'
      +'<div class="clock-read" id="clockRead"></div>'
      +'<div class="clock-btns"><button class="btn ghost small" id="btnMinBack">分针 −5分</button><button class="btn mint" id="btnClockOk">就是这个时间！</button><button class="btn ghost small" id="btnMinFwd">分针 +5分</button></div>'
      +'<div style="font-size:14px;opacity:.75">第 '+(done+1)+" / "+rounds+" 题</div>";
    stage.appendChild(wrap);
    $("#underStage").innerHTML="";
    const hourG=wrap.querySelector("#hourHand"),minG=wrap.querySelector("#minHand"),read=wrap.querySelector("#clockRead");
    function render(){
      const hDeg=(cur/60%12)*30, mDeg=(cur%60)*6;
      hourG.setAttribute("transform","rotate("+hDeg+" 100 100)");
      minG.setAttribute("transform","rotate("+mDeg+" 100 100)");
      const hh=Math.floor(cur/60)%12||12, mm=cur%60;
      read.innerHTML='现在是 <b class="num">'+hh+" : "+String(mm).padStart(2,"0")+"</b>（短针是时针，长针是分针）";
    }
    render();
    const svg=wrap.querySelector("#clockSvg");
    let dragging=false;
    function angleFromEvent(e){
      const r=svg.getBoundingClientRect();
      const cx=r.left+r.width/2, cy=r.top+r.height/2;
      const px=(e.touches?e.touches[0].clientX:e.clientX), py=(e.touches?e.touches[0].clientY:e.clientY);
      let deg=Math.atan2(px-cx,-(py-cy))*180/Math.PI; if(deg<0)deg+=360;
      return deg;
    }
    function applyAngle(deg){
      const snapMin=Math.round(deg/6/5)*5%60;
      const hourPart=Math.floor(cur/60);
      let next=hourPart*60+snapMin;
      if(snapMin< (cur%60) -30)next+=60; // 转过12点方向进一位小时
      cur=next%720; if(cur===0)cur=720;
      render();
    }
    function down(e){dragging=true;applyAngle(angleFromEvent(e));if(e.cancelable)e.preventDefault();}
    function move(e){if(!dragging)return;const deg=angleFromEvent(e);const snapMin=Math.round(deg/6/5)*5%60;const curMin=cur%60;
      if(Math.abs(snapMin-curMin)>2&&Math.abs(snapMin-curMin)<58){cur=(Math.floor(cur/60)*60)+snapMin;if(cur===0)cur=720;cur=cur%720||720;render();sfx("step");}}
    function up(){dragging=false;}
    svg.addEventListener("pointerdown",down);window.addEventListener("pointermove",move);window.addEventListener("pointerup",up);
    svg.addEventListener("touchstart",down,{passive:false});svg.addEventListener("touchmove",e=>{if(dragging){move(e);e.preventDefault();}},{passive:false});svg.addEventListener("touchend",up);
    const cleanup=()=>{window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up);};
    const prevCleanup=G.cleanup; G.cleanup=()=>{cleanup();if(prevCleanup)prevCleanup();};
    wrap.querySelector("#btnMinFwd").addEventListener("click",()=>{cur+=5;if(cur>720)cur-=720;render();sfx("step");});
    wrap.querySelector("#btnMinBack").addEventListener("click",()=>{cur-=5;if(cur<=0)cur+=720;render();sfx("step");});
    wrap.querySelector("#btnClockOk").addEventListener("click",()=>{
      const norm=v=>((v%720)+720)%720;
      if(norm(cur)===norm(target)){sfx("good");cleanup();done++;
        if(done>=rounds)setTimeout(()=>winLevel(),400); else setTimeout(newRound,600);}
      else mistakeFx(wrap.querySelector("#btnClockOk"));
    });
  }
  newRound();
};

/* ---------- 走迷宫 ---------- */
BUILDERS.maze=function(){
  const d=G.lv.d;
  const N=d===1?5:(d===2?7:9);
  // 递归回溯生成迷宫：cells[y][x] = {r:右墙, b:下墙}
  const cells=Array.from({length:N},()=>Array.from({length:N},()=>({r:true,b:true,v:false})));
  const stack=[[0,0]]; cells[0][0].v=true;
  while(stack.length){
    const[cx,cy]=stack[stack.length-1];
    const nb=[];
    if(cx>0&&!cells[cy][cx-1].v)nb.push([cx-1,cy,"L"]);
    if(cx<N-1&&!cells[cy][cx+1].v)nb.push([cx+1,cy,"R"]);
    if(cy>0&&!cells[cy-1][cx].v)nb.push([cx,cy-1,"U"]);
    if(cy<N-1&&!cells[cy+1][cx].v)nb.push([cx,cy+1,"D"]);
    if(!nb.length){stack.pop();continue;}
    const[nx,ny,dir]=pick(nb);
    if(dir==="R")cells[cy][cx].r=false; if(dir==="L")cells[cy][nx].r=false;
    if(dir==="D")cells[cy][cx].b=false; if(dir==="U")cells[ny][nx].b=false;
    cells[ny][nx].v=true; stack.push([nx,ny]);
  }
  const stage=$("#stage");
  stage.innerHTML=plainBG(G.wi);
  const goalIsCat=G.wi===4;
  setTask(goalIsCat?"穿过迷宫，找到躲在最后的<b>墨墨</b>！":"穿过迷宫，帮奶盖找到小鱼干！用下面的方向按钮走路。");
  const board=document.createElement("div");board.className="maze-board";
  const cellPx=Math.max(30,Math.min(52,Math.floor((Math.min(window.innerWidth,560)-70)/N)));
  board.style.gridTemplateColumns="repeat("+N+", "+cellPx+"px)";
  board.style.gridTemplateRows="repeat("+N+", "+cellPx+"px)";
  let px=0,py=0,steps=0;
  function draw(){
    board.innerHTML="";
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){
      const c=cells[y][x];
      const dEl=document.createElement("div");dEl.className="mcell";
      dEl.style.cssText="background:rgba(255,255,255,.55);border-top:3px solid "+(y===0?INK:"transparent")+";border-left:3px solid "+(x===0?INK:"transparent")
        +";border-right:3.5px solid "+(c.r?INK:"rgba(255,255,255,.55)")+";border-bottom:3.5px solid "+(c.b?INK:"rgba(255,255,255,.55)");
      if(x===N-1&&y===N-1)dEl.innerHTML='<span class="mchar">'+(goalIsCat?blackCat(cellPx):ICONS.fish("#ff9f68"))+"</span>";
      else if(x===px&&y===py)dEl.innerHTML='<span class="mchar">'+whiteCat(cellPx)+"</span>";
      board.appendChild(dEl);
    }
  }
  draw();
  stage.appendChild(board);
  function tryMove(dx,dy){
    if(G.done)return;
    const nx=px+dx, ny=py+dy;
    if(nx<0||ny<0||nx>=N||ny>=N){sfx("wrong");return;}
    if(dx===1&&cells[py][px].r){sfx("wrong");return;}
    if(dx===-1&&cells[py][nx].r){sfx("wrong");return;}
    if(dy===1&&cells[py][px].b){sfx("wrong");return;}
    if(dy===-1&&cells[ny][nx].b){sfx("wrong");return;}
    px=nx;py=ny;steps++;sfx("step");draw();
    if(px===N-1&&py===N-1)setTimeout(()=>winLevel(steps<=N*2.2?3:(steps<=N*3.6?2:1)),300);
  }
  $("#underStage").innerHTML='<div class="maze-pad">'
    +'<span class="pad-empty"></span><button data-mv="0,-1" aria-label="上">▲</button><span class="pad-empty"></span>'
    +'<button data-mv="-1,0" aria-label="左">◀</button><button data-mv="0,1" aria-label="下">▼</button><button data-mv="1,0" aria-label="右">▶</button>'
    +'<span class="pad-empty"></span><span style="font-size:13px;opacity:.7;text-align:center">步数 <b class="num" id="mzSteps">0</b></span><span class="pad-empty"></span></div>';
  $$("#underStage [data-mv]").forEach(b=>b.addEventListener("click",()=>{
    const[a,bb]=b.dataset.mv.split(",").map(Number); tryMove(a,bb);
    const e=$("#mzSteps"); if(e)e.textContent=steps;
  }));
  let tx0=0,ty0=0;
  stage.addEventListener("touchstart",e=>{tx0=e.touches[0].clientX;ty0=e.touches[0].clientY;},{passive:true});
  stage.addEventListener("touchend",e=>{
    const dx=e.changedTouches[0].clientX-tx0, dy=e.changedTouches[0].clientY-ty0;
    if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
    if(Math.abs(dx)>Math.abs(dy))tryMove(dx>0?1:-1,0); else tryMove(0,dy>0?1:-1);
    const el=$("#mzSteps"); if(el)el.textContent=steps;
  },{passive:true});
};

    if(isB)diffs.forEach((df,i)=>{
      const s=document.createElement("div");
      s.style.cssText="position:absolute;left:"+df.x+"%;top:"+df.y+"%;width:34px;height:34px;transform:translate(-50%,-50%)";
      s.innerHTML=ICONS[df.ico](df.c); p.appendChild(s);
    });
    diffs.forEach((df,i)=>{
      const h=document.createElement("button");
      h.style.cssText="position:absolute;left:"+df.x+"%;top:"+df.y+"%;width:52px;height:52px;transform:translate(-50%,-50%);background:transparent;border:none;border-radius:50%;z-index:6";
      h.setAttribute("aria-label","找不同热点");
      h.addEventListener("click",ev=>{
        if(foundSet.has(i))return;
        foundSet.add(i); sfx("pop"); burst(ev.clientX,ev.clientY,12);
        [panelA,panelB].forEach(pn=>{
          const ring=document.createElement("div");
          ring.style.cssText="position:absolute;left:"+df.x+"%;top:"+df.y+"%;width:46px;height:46px;transform:translate(-50%,-50%);border:4px solid #ff5252;border-radius:50%;z-index:5;pointer-events:none";
          pn.appendChild(ring);
        });
        const e=$("#dfGot"); if(e)e.textContent=foundSet.size;
        if(foundSet.size>=nDiff)setTimeout(()=>winLevel(),450);
        else toast("找到一处不同！还剩 "+(nDiff-foundSet.size)+" 处",1100);
      });
      p.appendChild(h);
    });
    return p;
  }
  const wrap=document.createElement("div");
  wrap.style.cssText="position:absolute;inset:0;display:flex;gap:10px;padding:12px;align-items:stretch";
  const panelA=panel(false), panelB=panel(true);
  wrap.appendChild(panelA); wrap.appendChild(panelB);
  stage.appendChild(wrap);
  $("#underStage").innerHTML='<div class="find-list"><span class="find-chip" style="min-width:120px"><span style="font-size:15px;padding:4px 2px">已找到 <b class="num" id="dfGot">0</b> / '+nDiff+" 处</span></span></div>";
};

/* ---------- 影子配对 ---------- */
BUILDERS.shadow=function(){
  let rounds=3, done=0;
  const stage=$("#stage");
  const pool=["apple","fish","car","rocket","mushroom","flower","boat","train","balloon","key"];
  function silhouette(svgStr){return svgStr.replace(/fill="(?!none)[^"]*"/g,'fill="#4a4258"').replace(/stroke="(?!none)[^"]*"/g,'stroke="#4a4258"');}
  function newRound(){
    if(G.done)return;
    const target=pick(pool);
    const others=shuffle(pool.filter(p=>p!==target)).slice(0,2);
    const opts=shuffle([target].concat(others));
    stage.innerHTML=plainBG(G.wi);
    setTask("这个影子是谁的？点一点下面的小伙伴！");
    const wrap=document.createElement("div");
    wrap.style.cssText="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px";
    wrap.innerHTML='<div style="width:170px;height:170px;background:#fff;border:4px dashed '+INK+';border-radius:24px;display:grid;place-items:center;padding:20px">'+silhouette(ICONS[target]())+"</div>"
      +'<div style="font-size:16.5px;opacity:.85">黑黑的影子，到底是谁呢？</div>';
    stage.appendChild(wrap);
    $("#underStage").innerHTML='<div style="text-align:center;font-size:14.5px;opacity:.75;margin-top:10px">第 '+(done+1)+" / "+rounds+' 题</div><div class="hint-row">'+opts.map(nm=>'<button class="btn ghost" data-v="'+nm+'" style="width:78px;height:78px;padding:11px;border-radius:18px">'+ICONS[nm]()+"</button>").join("")+"</div>";
    $$("#underStage [data-v]").forEach(b=>b.addEventListener("click",()=>{
      if(b.dataset.v===target){sfx("good");b.classList.remove("ghost");b.classList.add("mint");done++;
        if(done>=rounds)setTimeout(()=>winLevel(),450); else setTimeout(newRound,650);}
      else mistakeFx(b);
    }));
  }
  newRound();
};

/* ---------- 像素方块 ---------- */
BUILDERS.pixel=function(){
  const d=G.lv.d;
  const PICS=[
    {name:"爱心", color:"#ff5252", rows:["01110","11111","11111","01110","00100"]},
    {name:"小星星", color:"#e8a100", rows:["00100","11111","01110","11011","10001"]},
    {name:"小金鱼", color:"#ff8c42", rows:["011010","111110","111111","111110","011010"]},
    {name:"小蘑菇", color:"#ff5252", rows:["01110","11111","00100","00100","01110"]},
    {name:"小月亮", color:"#e8a100", rows:["00111","01110","11100","01110","00111"]},
  ];
  const picP=pick(PICS);
  const N=5;
  const target=picP.rows.join("").split("").map(Number);
  const mine=new Array(N*N).fill(0);
  const stage=$("#stage");
  stage.innerHTML=plainBG(G.wi);
  setTask("照着左边的图案，用方块拼出一颗<b>"+picP.name+"</b>！点格子就能涂色。");
  const wrap=document.createElement("div");
  wrap.style.cssText="position:absolute;inset:0;display:flex;gap:16px;align-items:center;justify-content:center;padding:16px;flex-wrap:wrap";
  const mini=document.createElement("div");
  mini.innerHTML='<div style="font-size:14.5px;text-align:center;margin-bottom:6px">照着这个拼</div><div style="display:grid;grid-template-columns:repeat(5,20px);gap:2.5px;background:#fff;padding:8px;border:3px solid '+INK+';border-radius:12px">'
    +target.map(v=>'<span style="width:20px;height:20px;border-radius:4px;background:'+(v?picP.color:"#eee7db")+'"></span>').join("")+"</div>";
  const board=document.createElement("div");
  const cellPx=Math.max(40,Math.min(54,Math.floor((Math.min(window.innerWidth,560)-170)/5)));
  board.style.cssText="display:grid;grid-template-columns:repeat(5,"+cellPx+"px);gap:5px";
  function check(){ if(mine.every((v,i)=>v===target[i]))setTimeout(()=>winLevel(),300); }
  for(let i=0;i<N*N;i++){
    const b=document.createElement("button");
    b.style.cssText="width:"+cellPx+"px;height:"+cellPx+"px;border-radius:9px;border:3px solid "+INK+";background:#fff;box-shadow:0 3px 0 rgba(64,34,46,.7);padding:0";
    b.setAttribute("aria-label","像素格子");
    b.addEventListener("click",()=>{
      mine[i]=mine[i]?0:1; sfx("flip");
      b.style.background=mine[i]?picP.color:"#fff";
      b.style.transform="scale(.92)"; setTimeout(()=>b.style.transform="",110);
      check();
    });
    board.appendChild(b);
  }
  wrap.appendChild(mini); wrap.appendChild(board);
  stage.appendChild(wrap);
  $("#underStage").innerHTML='<div style="text-align:center;font-size:15px;opacity:.8;margin-top:10px">点错了？再点一下就能擦掉。</div>';
};

/* ---------- 挑出不一样 ---------- */
BUILDERS.odd=function(){
  let rounds=3, done=0;
  const stage=$("#stage");
  const SETS=[
    {same:()=>ICONS.apple(), odd:()=>ICONS.apple("#3ecf8e")},
    {same:()=>ICONS.fish("#4db8ff"), odd:()=>ICONS.fish("#ff9f68")},
    {same:()=>ICONS.star(), odd:()=>ICONS.moon()},
    {same:()=>ICONS.flower("#ff9ecb"), odd:()=>ICONS.flower("#4db8ff")},
    {same:()=>ICONS.ball("#ff6b6b"), odd:()=>ICONS.ball("#3ecf8e")},
    {same:()=>ICONS.heart(), odd:()=>ICONS.heart("#8b6fd8")},
  ];
  function newRound(){
    if(G.done)return;
    const set=pick(SETS);
    const total=9, oddIdx=rand(0,total-1);
    stage.innerHTML=plainBG(G.wi);
    setTask("有一只小伙伴和大家<b>不一样</b>，把它找出来！");
    const grid=document.createElement("div");
    grid.style.cssText="position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:20px;align-content:center;max-width:400px;margin:0 auto;width:100%";
    for(let i=0;i<total;i++){
      const b=document.createElement("button");
      b.style.cssText="background:rgba(255,255,255,.94);border:3.5px solid "+INK+";border-radius:18px;padding:13px;box-shadow:0 4px 0 rgba(64,34,46,.8);aspect-ratio:1;display:grid;place-items:center";
      b.innerHTML='<span style="width:82%;max-width:72px;display:block">'+(i===oddIdx?set.odd():set.same())+"</span>";
      b.setAttribute("aria-label","挑出不一样");
      b.addEventListener("click",()=>{
        if(i===oddIdx){sfx("good");b.style.background="#d9fbe8";done++;
          if(done>=rounds)setTimeout(()=>winLevel(),450); else setTimeout(newRound,600);}
        else mistakeFx(b);
      });
      grid.appendChild(b);
    }
    stage.appendChild(grid);
    $("#underStage").innerHTML='<div style="text-align:center;font-size:14.5px;opacity:.75;margin-top:10px">第 '+(done+1)+" / "+rounds+" 题</div>";
  }
  newRound();
};

/* ============================================================
   导航与初始化
   ============================================================ */
function renderEnd(){
  $("#endWhite").innerHTML=whiteCat(120,{happy:true});
  $("#endBlack").innerHTML=blackCat(104,{happy:true});
  $("#endStats").innerHTML=
    '<div class="end-line"><span>集齐的星星</span><b class="num">'+totalStars()+" / 90 颗</b></div>"
    +'<div class="end-line"><span>得到的金币</span><b class="num">'+P.coins+" 枚</b></div>"
    +'<div class="end-line"><span>通关房间</span><b class="num">'+doneCount()+" / 30 间</b></div>"
    +'<div class="end-line"><span>集齐的世界贴纸</span><b class="num">'+WORLDS.filter((w,wi)=>[0,1,2,3,4,5].every(k=>P.stars[wi*6+k+1])).length+" / 5 张</b></div>";
  const inner=$("#endInner");
  for(let i=0;i<10;i++){
    const h=document.createElement("span");h.className="heart";h.textContent="♥";
    h.style.cssText="left:"+rand(4,92)+"%;bottom:6%;font-size:"+rand(16,30)+"px;animation-delay:"+(i*0.45)+"s";
    inner.appendChild(h); setTimeout(()=>h.remove(),7000);
  }
  confettiRain();
}
document.addEventListener("DOMContentLoaded",()=>{
  renderHome();
  $$("[data-back]").forEach(b=>b.addEventListener("click",()=>{sfx("flip");show(b.dataset.back);if(b.dataset.back==="home")renderHome();}));
  $("#btnStart").addEventListener("click",()=>{ac();sfx("pop");startLevel(Math.min(P.unlocked,30));});
  $("#btnMap").addEventListener("click",()=>{ac();sfx("pop");renderMap();show("map");});
  $("#btnStory").addEventListener("click",()=>{ac();sfx("flip");storyIdx=0;renderStory();show("story");});
  $("#btnStoryNext").addEventListener("click",()=>{
    sfx("pop");
    if(storyIdx<STORY.length-1){storyIdx++;renderStory();}
    else{renderMap();show("map");}
  });
  $("#btnQuit").addEventListener("click",()=>{if(G&&G.cleanup)G.cleanup();G=null;closeWin();renderMap();show("map");});
  $("#btnWinMap").addEventListener("click",()=>{closeWin();renderMap();show("map");});
  $("#btnWinReplay").addEventListener("click",()=>{closeWin();startLevel(G?G.no:1);});
  $("#btnWinNext").addEventListener("click",()=>{
    closeWin();
    if(!G)return;
    if(G.lv.final){renderEnd();show("end");G=null;return;}
    if(G.no>=30){renderHome();show("home");return;}
    startLevel(G.no+1);
  });
  $("#btnEndMap").addEventListener("click",()=>{sfx("pop");renderMap();show("map");});
  $("#btnEndHome").addEventListener("click",()=>{sfx("pop");renderHome();show("home");});
  document.addEventListener("pointerdown",()=>ac(),{once:true});
});
</script>
